<style>
:root{
  --ink:#070605; --bone:#EDE4CF; --flare:#FF5A1E;
  --pcA:#D9B44A;            /* Love */
  --pcB:#EC7A62;            /* Mahomes */
  --risk:#EC5A3A;
  --u:1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0908;color:var(--bone);
  font-family:'IBM Plex Mono',monospace;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 14px 40px}

/* ---------- the review chrome, not part of the design ---------- */
.hdr{max-width:430px;width:100%}
.hdr h1{font-family:'Anton',sans-serif;font-weight:400;font-size:26px;letter-spacing:.01em;
  text-transform:uppercase;line-height:1}
.hdr p{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(237,228,207,.45);margin-top:7px;line-height:1.9}
.ctl{max-width:430px;width:100%;display:flex;gap:8px;flex-wrap:wrap}
.ctl button{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(237,228,207,.7);background:transparent;
  border:1px solid rgba(237,228,207,.24);padding:9px 12px;cursor:pointer}
.ctl button.on{color:var(--ink);background:var(--bone);border-color:var(--bone)}

/* ---------- the frame ---------- */
.phone{position:relative;width:100%;max-width:430px;height:min(932px,86vh);
  background:var(--ink);overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 70px rgba(0,0,0,.7)}
.phone:after{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;
  background-image:radial-gradient(rgba(0,0,0,.5) 1px,transparent 1px);
  background-size:3px 3px;opacity:.5;mix-blend-mode:multiply}

.top{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;
  padding:16px 18px 0;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;
  color:rgba(237,228,207,.42)}

/* ---------- the field, standing in ---------- */
.field{position:relative;flex-shrink:0;height:23%;min-height:132px;
  background:linear-gradient(180deg,#150e0a 0%,#1b1410 42%,#16261b 60%,#0f1c14 100%);
  display:flex;align-items:flex-end;gap:10px;padding:0 16px 12px}
.field:before{content:"THE TWO MEN STAND HERE";position:absolute;left:0;right:0;top:14%;
  text-align:center;font-size:7.5px;letter-spacing:.3em;color:rgba(237,228,207,.16)}
.man{flex:1;text-align:center}
.man b{font-family:'Anton',sans-serif;font-weight:400;font-size:26px;display:block;line-height:1}
.man .bar{display:block;height:12px;margin-top:6px;background:rgba(7,6,5,.82);
  border:1px solid rgba(237,228,207,.22);transform:skewX(-24deg);overflow:hidden}
.man .bar s{display:block;height:100%;width:0;text-decoration:none;
  background:rgba(237,228,207,.3);transition:width .5s ease}
.man.mine .bar s{background:var(--flare)}
.man span{display:block;font-size:7.5px;letter-spacing:.2em;margin-top:7px;
  color:rgba(237,228,207,.45)}

/* ---------- the panel ---------- */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;
  padding:10px 18px 14px;
  background:linear-gradient(180deg,rgba(7,6,5,0),rgba(7,6,5,.9) 12%,rgba(7,6,5,.98))}

/* the bug */
.bug{flex-shrink:0;font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;
  padding-bottom:7px;border-bottom:1px solid rgba(237,228,207,.14)}
.bug .r{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.bug .r:first-child{margin-top:0}
.score{font-size:10px;letter-spacing:.12em;color:rgba(237,228,207,.9)}
.score b{font-weight:400;color:rgba(237,228,207,.45)}
.score i{font-style:normal;color:rgba(237,228,207,.25)}
.score .up{color:var(--bone)}
.state{color:var(--flare)}
.clk{font-size:8px;color:rgba(237,228,207,.5)}
.qs{display:flex;gap:3px;width:52%}
.qs span{flex:1;height:4px;background:rgba(237,228,207,.13);overflow:hidden;
  transform:skewX(-24deg)}
.qs span i{display:block;height:100%;width:0;background:var(--flare);transition:width .5s linear}

/* ---------- 3. WHAT IS ON THE LINE ----------
   The streak used to be a chip in the corner, the same size as the date, while eleven
   nights were live. It is the loudest thing in the panel now, and it shares its slab with
   the card, because those are the two halves of the same sentence: what you lose and what
   you win. At risk it all goes red at once, edge included, so the state is readable from
   the corner of an eye. */
.stakes{flex-shrink:0;display:flex;align-items:stretch;gap:14px;
  margin:10px 0 2px;padding:10px 13px 11px 12px;
  background:rgba(237,228,207,.05);border-left:3px solid var(--mypc);
  clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);
  transition:background .4s ease,border-color .4s ease}
.stakes.risk{background:rgba(236,90,58,.09);border-left-color:var(--risk);
  animation:nag 2.4s ease-in-out infinite}
@keyframes nag{0%,100%{box-shadow:inset 0 0 0 1px rgba(236,90,58,0)}
  50%{box-shadow:inset 0 0 0 1px rgba(236,90,58,.55)}}
.stakes i{display:block;font-style:normal;font-size:7.5px;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(237,228,207,.42)}
.st-l{flex:1;min-width:0}
/* IT HAS TO WIN THE PANEL. At 34px it was the same visual weight as the tier word beside
   it, which put "eleven nights" and "rare" on a level. They are not on a level. */
.st-l b{font-family:'Anton',sans-serif;font-weight:400;font-size:50px;line-height:.88;
  display:inline-block;margin:2px 7px 0 0;transition:color .4s ease}
.stakes.risk .st-l b{color:var(--risk)}
.st-l em{font-style:normal;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(237,228,207,.55)}
/* the state is a stamp, not a caption */
.st-l .tag{display:inline-block;margin-top:6px;padding:3px 7px 3px 8px;
  font-size:7.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink);background:var(--flare);
  clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.stakes.risk .st-l .tag{background:var(--risk)}
.st-m{width:1px;background:rgba(237,228,207,.14);flex-shrink:0}
.st-r{flex-shrink:0;text-align:right}
.st-r b{display:block;font-family:'Anton',sans-serif;font-weight:400;font-size:22px;
  line-height:1.1;margin:5px 0 4px;color:var(--mypc)}
.st-r em{font-style:normal;display:block;font-size:8px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--flare)}
.stakes.risk .st-r em{color:var(--risk)}

/* ---------- the feed ---------- */
.feed{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:7px;padding:10px 0 4px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16px);
  mask-image:linear-gradient(180deg,transparent 0,#000 16px)}
.feed::-webkit-scrollbar{display:none}

.play{flex-shrink:0;background:rgba(237,228,207,.065);color:var(--bone);
  border-left:3px solid var(--flare);
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);
  padding:8px 13px 8px;box-shadow:2px 2px 0 rgba(0,0,0,.55);
  animation:in .42s cubic-bezier(.2,1.25,.35,1) both}
.play.turn{background:var(--bone);color:#0B0705;border-left-color:#C23A18}

.play.turn .sc{color:rgba(11,7,5,.55)}
.play.turn .sc b{color:#0B0705}

/* ---------- 1. ONE TAP ----------
   Two designed mechanisms went in the bin before this one. Emotions as words were feelings
   bolted onto a betting screen; a tap per player read as a vote, and the vote is over. The
   answer was the obvious thing: emoji with counts. It needs no explaining, it costs one
   thumb, and everybody already knows how it works.

   The counts are the interesting part. They are seeded from BOTH sides of the room, so a
   Love touchdown lights the fire for the twenty nine percent and the skull for the seventy
   one at the same time. The mix under a play is the split reacting, which is a thing you
   cannot get from a single number. */
.rx{display:flex;gap:5px;margin-top:9px;padding-top:8px;
  border-top:1px solid rgba(237,228,207,.10)}
.play.turn .rx{border-top-color:rgba(11,7,5,.16)}
.rx button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  background:rgba(237,228,207,.05);border:1px solid rgba(237,228,207,.16);
  padding:5px 2px 6px;cursor:pointer;line-height:1;
  transition:background .16s ease,border-color .16s ease,transform .12s ease}
.play.turn .rx button{background:rgba(11,7,5,.05);border-color:rgba(11,7,5,.18)}
.rx .e{font-size:15px;line-height:1;
  font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}

  font-variant-numeric:tabular-nums;color:rgba(237,228,207,.62)}
.play.turn .rx b{color:rgba(11,7,5,.6)}
.rx button.on{background:rgba(255,90,30,.16);border-color:rgba(255,90,30,.75)}
.rx button.on b{color:var(--flare)}
.rx button:active{transform:scale(.94)}
.rx button.pop{animation:pop .34s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}

/* the night's running tally, in the footer under the frozen pick split */
.tally{flex:1;display:flex;gap:12px;align-items:center}
.tally span{display:flex;gap:5px;align-items:center;color:rgba(237,228,207,.5)}
.tally .e{font-size:11px;line-height:1;
  font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}

.cmt{flex-shrink:0;display:flex;gap:8px;align-items:baseline;padding-left:13px;

  line-height:1.3;color:rgba(237,228,207,.92)}

.you{flex-shrink:0;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  padding:6px 0 6px 11px;border-left:2px solid var(--flare);color:var(--flare);
  animation:in .42s cubic-bezier(.2,1.25,.35,1) both}
.you.bad{border-left-color:var(--risk);color:var(--risk)}
.you b{font-weight:400;color:var(--bone)}

/* ---------- 2. PRESENCE ----------
   A static number is a fact. The same number moving is a nervous system. It counts people
   HERE rather than people alive, because nobody is eliminated until the whistle and a
   survivor count that drifted mid game would be a lie. It rises into the fourth quarter,
   which is the arc we want anyway, and it jumps when something happens. */
.pres{flex-shrink:0;display:flex;align-items:center;gap:8px;
  margin-top:8px;padding-top:8px;border-top:1px solid rgba(237,228,207,.14);
  font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(237,228,207,.45)}
.pres .blip{width:6px;height:6px;border-radius:50%;background:var(--flare);flex-shrink:0;
  box-shadow:0 0 0 0 rgba(255,90,30,.55)}
.pres .blip.go{animation:blip 1.1s ease-out}
@keyframes blip{0%{box-shadow:0 0 0 0 rgba(255,90,30,.55)}
  100%{box-shadow:0 0 0 9px rgba(255,90,30,0)}}
.pres b{font-family:'Anton',sans-serif;font-weight:400;font-size:16px;letter-spacing:.01em;
  color:var(--bone);font-variant-numeric:tabular-nums}
.pres .d{margin-left:auto;color:var(--flare);opacity:0;transition:opacity .5s ease}
.pres .d.show{opacity:1}

/* THE PICKS CANNOT MOVE AND THE NOISE CAN. Putting them one above the other is the whole
   argument: the top row is what everybody committed to before kickoff and is now frozen,
   the bottom row is the same room in real time. A bar that shifts under a number that
   cannot is more interesting than either on its own. */
.foot{flex-shrink:0;padding-top:8px;margin-top:8px;
  border-top:1px solid rgba(237,228,207,.14);font-size:8px;letter-spacing:.16em}
.foot .fr{display:flex;align-items:center;gap:10px;margin-top:7px}
.foot .fr:first-child{margin-top:0}

  font-size:7px;letter-spacing:.24em}
.foot .picks{flex:1;display:flex;justify-content:space-between}
.foot .a{color:var(--pcA)} .foot .b{color:var(--pcB)}
.nbar{flex:1;display:flex;height:7px;gap:2px;transform:skewX(-24deg)}
.nbar i{display:block;transition:width .7s cubic-bezier(.3,.9,.3,1)}
.nbar .na{background:var(--pcA)} .nbar .nb2{background:var(--pcB)}
.foot .nnum{flex-shrink:0;font-variant-numeric:tabular-nums;color:rgba(237,228,207,.55)}
.foot .nnum b{font-weight:400}

.say{flex-shrink:0;display:flex;align-items:center;gap:10px;margin-top:9px;
  padding:8px 9px 8px 11px;background:rgba(237,228,207,.08);
  border-left:3px solid var(--mypc);
  clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.say .dot{width:7px;height:7px;border-radius:50%;background:var(--mypc);flex-shrink:0}
.say input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--bone);
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;padding:4px 0}
.say input::placeholder{color:rgba(237,228,207,.5)}
.say button{flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.22em;text-transform:uppercase;color:rgba(237,228,207,.55);
  background:transparent;border:1px solid rgba(237,228,207,.28);padding:8px 13px;
  cursor:pointer;transition:color .18s ease,border-color .18s ease,background .18s ease}
.say.armed button{color:#0B0705;background:var(--flare);border-color:var(--flare)}

@keyframes in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
</style>

<script>
'use strict';
const el=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const nf=n=>Math.round(n).toLocaleString('en-US');

/* The same authored night the app runs, so the two can be compared line for line. */
const GAME={
  clock:['Q1 11:40','Q1 4:02','Q2 13:55','Q2 8:10','Q2 2:18','HALF',
         'Q3 10:31','Q3 4:47','Q4 12:06','Q4 7:33','Q4 3:52','Q4 1:14','FINAL'],
  love:   [10, 24, 54, 80, 104, 116, 132, 166, 196, 232, 262, 282, 301],
  mahomes:[28, 62, 80, 96, 114, 136, 162, 190, 206, 218, 240, 268, 279],
  gb:     [ 0,  0,  7, 10,  17, 17,  17,  24,  27,  34,  37,  37,  37],
  kc:     [ 7, 14, 14, 14,  14, 21,  28,  28,  28,  28,  28,  35,  35],
  line:[
    {w:'b',s:'td',t:'Mahomes 12 yard touchdown pass to Kelce'},
    {w:'b',s:'td',t:'Mahomes 3 yard touchdown pass to Pacheco'},
    {w:'a',s:'td',t:'Love 30 yard touchdown pass to Watson'},
    {w:'a',s:'fg',t:'Love 26 yards to Reed. Crosby finishes it from 31'},
    {w:'a',s:'td',t:'Love 24 yard touchdown pass to Wicks'},
    {w:'b',s:'td',t:'Mahomes 8 yards to Kelce with four seconds left'},
    {w:'b',s:'td',t:'Mahomes 21 yard touchdown pass to Rice'},
    {w:'a',s:'td',t:'Love 34 yard touchdown pass to Watson'},
    {w:'a',s:'fg',t:'Love 30 yards to Doubs. Crosby good from 44'},
    {w:'a',s:'td',t:'Love 36 yard touchdown pass to Watson'},
    {w:'a',s:'fg',t:'Love 22 yards to Reed. Crosby good from 39'},
    {w:'b',s:'td',t:'Mahomes 28 yard touchdown pass to Worthy'},
    {w:'a',s:'',  t:'Green Bay 37, Kansas City 35. Love 301, Mahomes 279'},
  ]};
const ROOM=[
  {i:0,s:'b',who:'@bigredsun',t:'Told you. He does not need to be spectacular.'},
  {i:0,s:'a',who:'@stockholder',t:'Long game. Ask me at the two minute warning.'},
  {i:1,s:'b',who:'@arrowhead__',t:'Thirty four yards that drive and none of it hard.'},
  {i:2,s:'a',who:'@titletown',t:'There it is. That is the throw I paid for.'},
  {i:3,s:'a',who:'@northgate',t:'Take the three. He has moved it every drive since.'},
  {i:3,s:'b',who:'@bigredsun',t:'One drive. Call me when it is a game.'},
  {i:4,s:'a',who:'@stockholder',t:'Three straight scores and the lead. Check the crowd number.'},
  {i:5,s:'b',who:'@ksclock',t:'Four seconds left and he takes the lead back. Of course.'},
  {i:6,s:'b',who:'@arrowhead__',t:'Nine times they led at the half. Nine times they won.'},
  {i:6,s:'a',who:'@titletown',t:'Sure. And nine times it was not this kid.'},
  {i:7,s:'a',who:'@northgate',t:'Thirty four in the air to Watson again. He is not blinking.'},
  {i:8,s:'a',who:'@cheeseline',t:'Down two corners and still airing it out.'},
  {i:8,s:'b',who:'@bigredsun',t:'This is the part where it stops.'},
  {i:9,s:'a',who:'@titletown',t:'IT DOES NOT STOP.'},
  {i:9,s:'b',who:'@arrowhead__',t:'Ok. That one hurt.'},
  {i:10,s:'a',who:'@stockholder',t:'Twenty nine percent of us and every one of us standing.'},
  {i:11,s:'b',who:'@ksclock',t:'Two points and seventy four seconds. It is Mahomes.'},
  {i:12,s:'a',who:'@northgate',t:'The kid stood up. That is the whole story.'},
];
const SIDE={LOVE:{pc:'#D9B44A',share:29,tier:'RARE',k:'love',w:'a'},
            MAHOMES:{pc:'#EC7A62',share:71,tier:'COMMON',k:'mahomes',w:'b'}};
const STOP=2600, STREAK=11, LAST=GAME.clock.length-1;
let PICK='LOVE', i=-1, timer=null, on50=null, seen=[], pres=8200;

/* Same decay model the app uses: how likely your man is still ahead at the whistle given
   the margin now and how much game is left to swing it. */
function oddsSide(side,n){
  const mine=GAME[side==='a'?'love':'mahomes'][n], other=GAME[side==='a'?'mahomes':'love'][n];
  const left=1-n/LAST, sd=Math.max(5,78*Math.sqrt(left));
  return clamp(Math.round(100/(1+Math.exp(-1.702*(mine-other)/sd))),1,99);
}
const odds=n=>oddsSide(SIDE[PICK].w,n);
function qAt(n){const c=GAME.clock[n];
  if(c==='HALF')return{q:2,p:1}; if(c==='FINAL')return{q:4,p:1};
  const m=c.match(/Q(\d) (\d+):(\d+)/);
  return{q:+m[1],p:clamp(1-((+m[2])+(+m[3])/60)/15,0,1)};}

/* ---------- reactions ----------
   Five, in surrogate escapes rather than literal characters so the file stays pure ASCII
   and cannot be mangled by whatever charset the page is served under. That has already
   bitten once here: an apostrophe came back as three characters.
     fire   he is cooking
     smug   not worried
     sweat  starting to feel it
     skull  that is the game
     pray   nothing left but hope                                                        */
const RX=[
  {k:'fire', e:'\uD83D\uDD25'},
  {k:'smug', e:'\uD83D\uDE24'},
  {k:'sweat',e:'\uD83D\uDE30'},
  {k:'skull',e:'\uD83D\uDC80'},
  {k:'pray', e:'\uD83D\uDE4F'},
];
const TALLY={fire:0,smug:0,sweat:0,skull:0,pray:0};
const climbing=[];

/* Both sides react to every play. Whoever the play helped brings the fire and the shrug;
   whoever it hurt brings the skull, the sweat and the prayer. The side counts are taken to
   a fractional power because a small crowd is not a quiet one: twenty nine percent who
   backed the underdog react harder per head than the seventy one who took the chalk. */
function seedRx(n){
  const L=GAME.line[n];
  const size=L.s==='td'?1:L.s==='fg'?.58:.34;
  const yd=+((L.t.match(/(\d+)\s*yard/)||[0,14])[1]);
  const spec=clamp(yd/34,.6,1.5);
  const up=L.w==='a'?SIDE.LOVE.share:SIDE.MAHOMES.share;
  const dn=100-up;
  const w=x=>Math.pow(x/100,.42);
  /* DESPAIR IS NOT PER PLAY, IT IS POSITIONAL. Weighting the skull purely by crowd size
     made it beat the fire on your own touchdown, because the side that just lost ground is
     the bigger one. That reads awfully and it is also wrong: one score does not bury a man
     who is still ahead. So the negative set scales with how much trouble the hurt side is
     actually in, taken off the same odds the card uses. Early, when Love backers are at
     twenty percent, a Mahomes score brings the skull out. Late, with Love in front, the
     same score barely raises a sweat. */
  const hurt=L.w==='a'?'b':'a';
  const trouble=clamp(1-oddsSide(hurt,n)/55,0,1);
  const base=2600*size*spec, j=()=>.85+Math.random()*.3;
  return {fire :Math.round(base*w(up)*1.25*j()),
          smug :Math.round(base*w(up)*0.50*j()),
          sweat:Math.round(base*w(dn)*(0.30+0.55*trouble)*j()),
          skull:Math.round(base*w(dn)*(0.25+0.90*trouble)*j()),
          pray :Math.round(base*w(dn)*(0.15+0.45*trouble)*j())};
}
function rxRow(n){
  const target=seedRx(n), row=document.createElement('div');
  row.className='rx';
  const st={target,shown:{},mine:{},els:{},t0:performance.now()};
  RX.forEach(r=>{
    st.shown[r.k]=Math.round(target[r.k]*.16); st.mine[r.k]=false;
    const b=document.createElement('button'); b.type='button';
    b.innerHTML='<span class="e">'+r.e+'</span><b>'+nf(st.shown[r.k])+'</b>';
    b.onclick=()=>{
      st.mine[r.k]=!st.mine[r.k];
      b.classList.toggle('on',st.mine[r.k]);
      const d=st.mine[r.k]?1:-1;
      st.target[r.k]+=d; st.shown[r.k]+=d; TALLY[r.k]+=d;
      b.querySelector('b').textContent=nf(st.shown[r.k]);
      b.classList.remove('pop'); void b.offsetWidth; if(d>0)b.classList.add('pop');
      tally(); bump(d>0?45:0);
    };
    st.els[r.k]=b; row.appendChild(b);
    TALLY[r.k]+=target[r.k];
  });
  climbing.push(st); tally();
  return row;
}
/* fast then slow over about ten seconds, then it settles. A count that lands finished is a
   number; a count you watch climb is a room. */
setInterval(()=>{
  const now=performance.now();
  for(let x=climbing.length-1;x>=0;x--){
    const st=climbing[x], pr=clamp((now-st.t0)/10000,0,1), e=1-Math.pow(1-pr,2.4);
    let live=false;
    RX.forEach(r=>{
      const v=Math.round(st.target[r.k]*(.16+.84*e))+(st.mine[r.k]?1:0);
      if(v!==st.shown[r.k]){st.shown[r.k]=v;
        st.els[r.k].querySelector('b').textContent=nf(v);live=true;}
    });
    if(pr>=1&&!live)climbing.splice(x,1);
  }
},180);
function tally(){
  const top=RX.slice().sort((a,b)=>TALLY[b.k]-TALLY[a.k]).slice(0,3);
  el('tally').innerHTML=top.map(r=>
    '<span><i class="e">'+r.e+'</i><b>'+nf(TALLY[r.k])+'</b></span>').join('');
}

/* ---------- presence ---------- */
function bump(n){ pres+=n;
  el('presN').textContent=nf(pres);
  const d=el('presD'); d.textContent='+'+nf(n); d.classList.add('show');
  const b=el('presBlip'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
  clearTimeout(bump._t); bump._t=setTimeout(()=>d.classList.remove('show'),1400);
}
setInterval(()=>{                      // it breathes between plays as well
  if(i<0||i>LAST)return;
  const drift=Math.round((Math.random()*2-.7)*22);
  pres=Math.max(2000,pres+drift); el('presN').textContent=nf(pres);
},900);

/* ---------- the panel ---------- */
function follow(){const f=el('feed');return f.scrollHeight-f.scrollTop-f.clientHeight<40;}
function add(node,forced){const f=el('feed'),go=forced||follow();
  f.appendChild(node); if(go)f.scrollTop=f.scrollHeight;}

function setSide(p){
  PICK=p; const S=SIDE[p];
  document.documentElement.style.setProperty('--mypc',S.pc);
  el('sideA').classList.toggle('on',p==='LOVE');
  el('sideB').classList.toggle('on',p==='MAHOMES');
  el('manA').classList.toggle('mine',p==='LOVE');
  el('manB').classList.toggle('mine',p==='MAHOMES');
  el('stTier').textContent=S.tier;
  el('splitA').textContent='LOVE 29%'+(p==='LOVE'?' \u00B7 YOU':'');
  el('splitB').textContent='MAHOMES 71%'+(p==='MAHOMES'?' \u00B7 YOU':'');
}

function head(n){
  const g=GAME.gb[n],k=GAME.kc[n];
  el('score').innerHTML='<b>GB</b> <span class="'+(g>=k?'up':'')+'">'+g+'</span>'+
    ' <i>\u00B7</i> <b>KC</b> <span class="'+(k>=g?'up':'')+'">'+k+'</span>';
  el('clk').textContent=GAME.clock[n];
  const w=qAt(n);
  [...el('qs').children].forEach((sp,x)=>{
    sp.firstChild.style.width=(x+1<w.q?100:x+1>w.q?0:w.p*100)+'%';});
  const la=GAME.love[n], ma=GAME.mahomes[n];
  el('ya').textContent=la; el('yb').textContent=ma;
  el('ba').style.width=clamp(la/320*100,0,100)+'%';
  el('bb').style.width=clamp(ma/320*100,0,100)+'%';
  const mine=PICK==='LOVE'?la:ma, other=PICK==='LOVE'?ma:la, d=mine-other;
  el('state').textContent = d===0?'TIED':d>0?'YOU UP '+d:'YOU DOWN '+(-d);

  const p=odds(n), fin=n===LAST;
  el('stStreak').textContent = fin ? (p>=50?String(STREAK+1):'0') : String(STREAK);
  el('stTag').textContent = fin ? (p>=50?'Survived':'Gone') : (p>=50?'Holding':'At risk');
  el('stPct').textContent = fin ? (p>=50?'Minted':'Not tonight') : p+'% to mint';
  el('stakes').classList.toggle('risk',p<50);
  el('topR').textContent = fin?'FINAL':'LIVE';

  if(on50!==null && (p>=50)!==on50){
    const d2=document.createElement('div');
    d2.className='you'+(p>=50?'':' bad');
    d2.innerHTML=(p>=50?'Your card is back on. <b>':'Your card is slipping. <b>')+p+'% to mint '+SIDE[PICK].tier+'</b>';
    add(d2);
  }
  on50=p>=50;
}

function step(){
  i++;
  if(i>LAST){clearInterval(timer);timer=null;return;}
  const L=GAME.line[i];
  const la=GAME.love[i],ma=GAME.mahomes[i];
  const lead=la===ma?null:(la>ma?'a':'b');
  const turned=seen.lead!==undefined&&seen.lead!==null&&lead!==seen.lead;
  seen.lead=lead;

  const d=document.createElement('div');
  d.className='play'+(turned?' turn':'');
  const flag=L.s==='td'?'Touchdown':L.s==='fg'?'Field goal':'';
  d.innerHTML='<div class="stamp"><span>'+GAME.clock[i]+'</span>'+
              (flag?'<span class="flag">'+flag+'</span>':'')+'</div>'+
              '<span class="txt">'+(turned?'\u25B2 ':'')+L.t+'</span>'+
              (L.s?'<span class="sc">'+scline(i)+'</span>':'');
  d.appendChild(rxRow(i));
  add(d);

  // a score moves the room, and a lead change moves it more
  bump(Math.round((L.s==='td'?520:L.s==='fg'?260:110)*(turned?2.1:1)*(0.8+Math.random()*0.5)));

  ROOM.filter(r=>r.i===i).forEach((r,k)=>setTimeout(()=>{
    const c=document.createElement('div');
    c.className='cmt '+r.s;
    c.innerHTML='<span class="dot"></span><span class="who">'+r.who+'</span><span class="t"></span>';
    c.querySelector('.t').textContent=r.t;
    add(c);
  },700+k*780));

  head(i);
}
function scline(n){const g=GAME.gb[n],k=GAME.kc[n];
  return (g>=k?'<b>GB '+g+'</b>':'GB '+g)+' \u00B7 '+(k>=g?'<b>KC '+k+'</b>':'KC '+k);}

function run(){
  clearInterval(timer); timer=null;
  i=-1; on50=null; seen=[]; climbing.length=0; pres=8200;
  RX.forEach(r=>TALLY[r.k]=0); tally();
  el('feed').innerHTML='';
  el('qs').innerHTML='<span><i></i></span>'.repeat(4);
  el('presN').textContent=nf(pres); el('presD').classList.remove('show');
  el('stakes').classList.remove('risk');
  el('sayIn').value=''; el('say').classList.remove('armed');
  head(0); el('ya').textContent='0'; el('yb').textContent='0';
  el('ba').style.width='0'; el('bb').style.width='0';
  el('clk').textContent='Q1 15:00'; el('state').textContent='TIED';
  el('stStreak').textContent=String(STREAK); el('stTag').textContent='Holding';
  el('stPct').textContent='50% to mint'; el('topR').textContent='LIVE';
  setTimeout(()=>{step(); timer=setInterval(step,STOP);},500);
}

el('say').addEventListener('submit',e=>{
  e.preventDefault();
  const t=el('sayIn').value.trim(); if(!t)return;
  const c=document.createElement('div');
  c.className='cmt me '+SIDE[PICK].w;
  c.innerHTML='<span class="dot"></span><span class="who">@you</span><span class="t"></span>';
  c.querySelector('.t').textContent=t;
  add(c,true);
  el('sayIn').value=''; el('say').classList.remove('armed'); bump(1);
});
el('sayIn').addEventListener('input',()=>
  el('say').classList.toggle('armed',el('sayIn').value.trim().length>0));
el('again').onclick=run;
el('sideA').onclick=()=>{setSide('LOVE');run();};
el('sideB').onclick=()=>{setSide('MAHOMES');run();};

setSide('LOVE'); run();
</script>
