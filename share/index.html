<style>
:root{
  --g1:#0B0907; --g2:#131009; --g3:#1E1810;
  --t1:#F2E9D4; --t2:#A39A89; --t3:#6B6459;
  --flare:#FF5A1E; --risk:#F2542D;
  --pcA:#D9B44A; --pcB:#EC7A62;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050403;color:var(--t1);font-family:'IBM Plex Mono',monospace;
  -webkit-font-smoothing:antialiased;padding:24px 16px 60px;
  display:flex;flex-direction:column;align-items:center;gap:16px}
.wrap{width:100%;max-width:900px}
h1{font-family:'Anton',sans-serif;font-weight:400;font-size:30px;text-transform:uppercase;line-height:1}
.sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);
  margin-top:8px;line-height:1.9}

/* the step rail */
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 4px}
.steps button{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--t3);background:transparent;
  border:1px solid #241E16;padding:8px 10px;cursor:pointer;
  transition:color .16s ease,border-color .16s ease,background .16s ease}
.steps button:hover{color:var(--t2);border-color:#332B20}
.steps button.on{color:#0B0907;background:var(--t1);border-color:var(--t1)}
.steps .n{color:inherit;opacity:.55;margin-right:6px}

.row{display:flex;gap:22px;align-items:flex-start;margin-top:14px}
@media (max-width:760px){.row{flex-direction:column}}

/* the frame */
.phone{position:relative;flex-shrink:0;width:340px;height:716px;background:var(--g1);
  overflow:hidden;box-shadow:0 26px 60px rgba(0,0,0,.7)}
.panel{position:absolute;inset:0;display:none;flex-direction:column}
.panel.on{display:flex}

/* the annotation */
.note{flex:1;min-width:0;padding-top:2px}
.note h2{font-family:'Anton',sans-serif;font-weight:400;font-size:21px;line-height:1.1;
  text-transform:uppercase;margin-bottom:10px}
.note p{font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:17px;
  line-height:1.45;color:var(--t2);margin-bottom:11px}
.note p b{font-weight:700;color:var(--t1)}
.note .k{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--flare);
  border:1px solid rgba(255,90,30,.4);padding:4px 8px;margin-bottom:12px}
.note ul{list-style:none;margin:0 0 12px}
.note li{font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:16px;
  line-height:1.4;color:var(--t2);padding-left:16px;position:relative;margin-bottom:6px}
.note li:before{content:"";position:absolute;left:0;top:9px;width:6px;height:1px;background:var(--t3)}
.note li b{font-weight:700;color:var(--t1)}

/* ---------- shared bits ---------- */
.top{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;
  padding:14px 15px 0;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--t3)}
.top .me{color:var(--t2)}
.kick{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--t3);text-align:center}
.big{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;line-height:1}

/* ---------- the card ---------- */
.card{width:206px;aspect-ratio:5/7;position:relative;background:#0B0906;
  border:3px solid transparent;
  background:linear-gradient(#0B0906,#0B0906) padding-box,
    linear-gradient(100deg,#7A2B10,#FF5A1E 35%,#FFC24A 50%,#FF5A1E 66%,#7A2B10) border-box;
  display:flex;flex-direction:column;overflow:hidden}
.card .art{flex:1;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 78%,#2B2314,#12100A 70%)}
.card .art img{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);
  height:64%;image-rendering:pixelated}
.card .tag{position:absolute;z-index:3;top:9px;left:-2px;padding:3px 8px 3px 10px;
  font-size:6.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;
  color:#120602;background:var(--flare)}
.card .crowd{position:absolute;z-index:3;left:11px;right:11px;bottom:66px}
.card .crowd i{font-style:normal;display:block;font-size:7px;letter-spacing:.14em;
  text-transform:uppercase;color:#C9BFA8;margin-bottom:5px}
.card .crowd i b{color:var(--flare);font-weight:600}
.card .split{height:4px;background:#2A241B;display:flex}
.card .split s{display:block;height:100%;text-decoration:none;background:var(--pcA)}
.card .info{flex-shrink:0;padding:9px 11px 10px;background:#0B0906;position:relative}
.card .pname{font-family:'Anton',sans-serif;font-size:16px;line-height:1;color:var(--t1)}
.card .pname span{color:var(--pcA)}
.card .pmeta{font-size:6.5px;letter-spacing:.1em;color:var(--t3);margin-top:5px}
.card .serial{position:absolute;right:11px;top:9px;text-align:right;font-size:6px;
  letter-spacing:.14em;color:var(--t3);line-height:1.5}
.card .serial b{display:block;font-weight:600;font-size:8px;color:var(--t1)}
/* the card is used at three sizes and the info block does not scale with it, so the
   serial ran into the surname the moment it shrank for the still. Scale the type with
   the card rather than hoping 206px is the only width it ever gets. */
.still .card .pname{font-size:11.5px}
.still .card .pmeta{font-size:5px;margin-top:4px}
.still .card .serial{font-size:5px;top:8px;right:9px}
.still .card .serial b{font-size:6.5px}
.still .card .info{padding:7px 9px 8px}
.still .card .crowd{bottom:48px;left:9px;right:9px}
.still .card .crowd i{font-size:6px}
.att .still .card .pname{font-size:8px}
.att .still .card .pmeta{display:none}
.att .still .card .serial{font-size:4px}
.att .still .card .serial b{font-size:5px}
.att .still .card .crowd{bottom:34px}

/* ---------- 1 the reveal ---------- */
.rv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:20px 16px;background:
    radial-gradient(ellipse at 50% 0%,rgba(255,150,70,.16),transparent 60%),var(--g1)}
.rv .bar{display:flex;gap:8px;width:100%;justify-content:center}
.btn{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--t2);background:transparent;
  border:1px solid #2F281E;padding:10px 13px;cursor:pointer}
.btn.prime{color:#0B0907;background:var(--flare);border-color:var(--flare)}
.btn.send{color:var(--flare);border-color:rgba(255,90,30,.6)}
.rv .note2{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);text-align:center}
.rv .note2 b{color:var(--t1);font-weight:400}

/* ---------- 2 the still ---------- */
.still{width:236px;aspect-ratio:9/16;margin:auto;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#0E0A06,#160F09 46%,#0D1B12 100%);
  display:flex;flex-direction:column;align-items:center;padding:16px 14px 14px;gap:10px}
.still .who{font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--t2)}
.still .who b{color:var(--t1);font-weight:400}
.still .card{width:150px}
.still .q{margin-top:auto;text-align:center}
.still .q .big{font-size:15px;color:var(--t1);letter-spacing:.01em}
.still .q .when{font-size:7.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--flare);margin-top:6px}
.still .streak{font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3)}
.still .streak b{color:var(--t1);font-weight:400}

/* ---------- 3 the thread ---------- */
.thread{flex:1;background:#0A0A0B;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.thread .hdr{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3);
  text-align:center;padding-bottom:8px;border-bottom:1px solid #1A1A1C}
.bub{align-self:flex-end;max-width:78%;background:#1F6FEB;color:#fff;border-radius:16px;
  padding:9px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:15px}
.att{align-self:flex-end;width:150px}
.att .still{width:150px;padding:10px 9px 9px;gap:6px}
.att .still .card{width:104px}
.att .still .q .big{font-size:10px}
.att .still .q .when{font-size:6px}
.att .still .who,.att .still .streak{font-size:6px}
.prev{align-self:flex-end;width:78%;background:#141416;border:1px solid #232326;
  border-radius:12px;overflow:hidden}
.prev .im{height:52px;background:linear-gradient(120deg,#160F09,#0D1B12);
  display:flex;align-items:center;justify-content:center;
  font-family:'Anton',sans-serif;font-size:11px;color:var(--t1);text-transform:uppercase;
  letter-spacing:.02em;text-align:center;padding:0 10px}
.prev .meta{padding:8px 10px}
.prev .meta b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:600;
  font-size:13px;color:#E8E8EA}
.prev .meta i{font-style:normal;display:block;font-size:8px;letter-spacing:.12em;
  color:#6E6E73;margin-top:3px}

/* ---------- 4/5/6 the landing ---------- */
.land{flex:1;display:flex;flex-direction:column;padding:16px 15px 15px;gap:12px;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,150,70,.13),transparent 55%),var(--g1)}
.from{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;background:var(--g3);
  border-left:3px solid var(--pcA)}
.from .dot{flex-shrink:0;width:7px;height:7px;border-radius:50%;background:var(--pcA);margin-top:4px}
.from .txt{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;
  line-height:1.3;color:var(--t1)}
.from .txt em{font-style:normal;color:var(--t2);font-weight:500;display:block;margin-top:3px;font-size:14px}
.ask{text-align:center;margin-top:4px}
.ask .big{font-size:23px;color:var(--t1)}
.ask .when{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--flare);margin-top:8px}
.picks{display:flex;gap:9px;margin-top:2px}
.pick{flex:1;background:var(--g3);border:1px solid #2A241B;padding:13px 10px;text-align:center;cursor:pointer}
.pick .n{font-family:'Anton',sans-serif;font-size:17px;color:var(--t1);line-height:1}
.pick .s{font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-top:6px}
.pick.a{border-left:3px solid var(--pcA)} .pick.b{border-left:3px solid var(--pcB)}
.land .foot{margin-top:auto;font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--t3);text-align:center;line-height:1.9}
.land .foot b{color:var(--t2);font-weight:400}
.together{padding:11px 12px;background:#241C0B;border-left:3px solid var(--pcA)}
.together .k{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3)}
.together .l{font-family:'Anton',sans-serif;font-size:19px;line-height:1.05;color:var(--t1);margin-top:5px}
.together .l span{color:var(--pcA)}
.together .m{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--flare);margin-top:7px}
.acct{padding:12px;background:var(--g3);border:1px solid #2A241B}
.acct .k{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3)}
.acct .h{font-family:'Anton',sans-serif;font-size:19px;color:var(--t1);margin:6px 0 4px;line-height:1.1}
.acct .p{font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:14.5px;
  color:var(--t2);line-height:1.35}
.acct .f{display:flex;align-items:center;gap:9px;margin-top:11px;padding:8px 9px 8px 11px;
  background:#0B0907;border-left:3px solid var(--pcA)}
.acct .f span{font-size:14px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-weight:600}
.acct .f .at{color:var(--pcA)}
.count{text-align:center;padding:14px 0}
.count .k{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--t3)}
.count .t{font-family:'Anton',sans-serif;font-size:34px;color:var(--t1);margin-top:6px;line-height:1}

/* ---------- 7 standing with you ---------- */
.live{flex:1;display:flex;flex-direction:column;padding:14px 15px 15px;gap:10px;background:var(--g2)}
.live .band{height:120px;background:linear-gradient(180deg,#140D08,#152219 62%,#0D1B12);
  position:relative;display:flex;align-items:flex-end;justify-content:space-around;padding-bottom:10px}
.live .band .n{font-family:'Anton',sans-serif;font-size:22px;color:var(--t1)}
.live .feedish{flex:1;display:flex;flex-direction:column;gap:7px}
.pl{background:var(--g3);border-left:3px solid var(--pcA);padding:8px 11px}
.pl .m{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3)}
.pl .t{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;
  color:var(--t1);margin-top:3px}
.withyou{margin-top:auto;padding-top:9px;border-top:1px solid #221C15}
.withyou .k{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3)}
.withyou .l{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.withyou .l b{font-family:'Anton',sans-serif;font-weight:400;font-size:17px;color:var(--t1)}
.withyou .l span{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--t2)}
.hands{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.hand{font-size:8.5px;letter-spacing:.06em;padding:4px 7px;border:1px solid #2A241B;color:var(--pcA)}
.hand.b{color:var(--pcB)}

/* ---------- the collection entry ---------- */
.shelf{flex:1;padding:16px 15px;display:flex;flex-direction:column;gap:12px;background:var(--g1)}
.shelf .mast{font-family:'Anton',sans-serif;font-size:24px;text-transform:uppercase;line-height:1}
.shelf .mast span{color:var(--flare)}
.shelf .hint{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3)}
.shelfcard{position:relative;align-self:center}
.shelfcard .send{position:absolute;right:-8px;bottom:44px;font-family:'IBM Plex Mono',monospace;
  font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--flare);
  background:#0B0907;border:1px solid rgba(255,90,30,.55);padding:6px 9px;cursor:pointer}
</style>

  <div class="sub">Standalone study &#183; nothing wired into the app<br>

  <div class="steps" id="steps"></div>

  <div class="row">
    <div class="phone" id="phone"></div>
    <div class="note" id="note"></div>
  </div>
</div>

 <div class="still">

const STEPS=[
{k:'The send',
 html:`<div class="top"><span>LFS &#183; AUG 18</span><span class="me">@cam</span></div>
  <div class="rv">
    <div class="kick">You minted</div>
    ${CARD}
    <div class="note2"><b>11,950</b> of you own one &#183; nobody else does</div>
    <div class="bar"><button class="btn prime">Add to the collection</button>
      <button class="btn send">Send it</button></div>
  </div>`,
 title:'Two taps, and the second one is not an icon',
 tag:'Entry point 1 of 2',
 body:[`<b>Send it</b> sits beside Add to the collection, not behind a share glyph in a corner. A share buried one tap deeper than this does not get used, and that is the whole mechanism gone.`,
  `It is worded as an action on the thing you just won, not as a feature of the app. Nobody taps <b>Share</b>. People tap <b>Send it</b>.`],
 list:[`The card is already the artifact. Nothing new gets generated for sharing, because the card is the only object in this product anyone wants.`,
  `<b>Add to the collection</b> stays primary. The share is offered, never pushed.`]},

{k:'The still',
 html:`<div class="top"><span>Preview</span><span class="me">9:16</span></div>
   <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:10px">${STILL}</div>`,
 title:'The crowd number is the payload',
 tag:'What actually gets sent',
 body:[`<b>RARE</b> on its own says nothing. <b>29% took this side and I was one of them</b> is the entire story, so the split is not decoration on this image, it is the reason to send it.`,
  `The bottom line is <b>the question, not the app name</b>. Nobody taps a logo. People tap a question they already have an opinion about, and this one arrives with a date attached.`],
 list:[`<b>@cam called it</b> at the top. Handles are on, so the flex has an owner.`,
  `The streak rides along, because eleven nights is a second brag the card cannot carry on its own.`,
  `Nine by sixteen: built for a story and a thread, not for a link preview crop.`]},

{k:'In the thread',
 html:`<div class="thread">
   <div class="hdr">Messages &#183; Dev</div>
   <div class="bub">nine straight and you still take mahomes every week</div>
   <div class="att">${STILL}</div>
   <div class="prev"><div class="im">Who throws for more yards tonight?</div>
     <div class="meta"><b>Green Bay at Kansas City &#183; 8:15p</b>
       <i>lastfan.standing &#183; pick before kickoff</i></div></div>
 </div>`,
 title:'It has to survive being sent',
 tag:'How it lands',
 body:[`Two objects go into the thread: the still, which is the flex, and the link, whose preview shows <b>the fixture and the deadline</b> rather than an app card.`,
  `A friend scrolling a thread should be able to tell what is being asked of them without opening anything. <b>Pick before kickoff</b> does that in three words.`],
 list:[`The preview never leads with the product name. It leads with the game.`]},

{k:'They open it',
 html:`<div class="top"><span>LFS &#183; AUG 19</span><span class="me">&nbsp;</span></div>
  <div class="land">
    <div class="from"><span class="dot"></span>
      <span class="txt">@cam took Love and it landed.
        <em>29% of the room did. He is eleven nights deep.</em></span></div>
    <div class="ask"><div class="big">Who throws for<br>more yards tonight?</div>
      <div class="when">Green Bay at Kansas City &#183; 8:15p ET</div></div>
    <div class="picks">
      <div class="pick a"><div class="n">LOVE</div><div class="s">258.9 a game</div></div>
      <div class="pick b"><div class="n">MAHOMES</div><div class="s">268.4 a game</div></div>
    </div>
    <div class="foot">No account yet &#183; no download yet<br><b>Pick first</b></div>
  </div>`,
 title:'Playable before it is an install',
 tag:'The part I would fight for',
 body:[`The link opens <b>tomorrow's pick</b>, not a download page. Your friend cannot play tonight, because tonight is settled and everybody gets the same daily matchup, so the ask can only ever be <b>be in the room tomorrow</b>.`,
  `They commit before anything is asked of them. No account, no install, no email. Two buttons and a question.`],
 list:[`The moment this becomes a store page it becomes an ad, and it dies there.`,
  `Your card is the reason they are here, so it is stated in one line and then got out of the way.`]},

{k:'They pick',
 html:`<div class="top"><span>LFS &#183; AUG 19</span><span class="me">&nbsp;</span></div>
  <div class="land">
    <div class="together"><div class="k">Locked</div>
      <div class="l">You and <span>@cam</span><br>took Love</div>
      <div class="m">29% of the room did &#183; 41,207 still standing</div></div>
    <div class="acct">
      <div class="k">Night one</div>
      <div class="h">You have a streak now</div>
      <div class="p">One night deep. It only counts if it has somewhere to live, and somewhere to be seen.</div>
      <div class="f"><span class="at">@</span><span>pick a handle</span></div>
    </div>
    <div class="foot">Kickoff in <b>3:41</b><br>we will tell you how it went</div>
  </div>`,
 title:'The account is asked for after there is something to lose',
 tag:'Your call, built as agreed',
 body:[`A person staring at a signup form has nothing at stake. A person who has just picked has <b>a streak of one</b> and nowhere to keep it. That is the entire conversion argument and it is why the order matters.`,
  `The ask is a handle, not an email and a password. Handles are on, and the handle is the thing that makes the next share work.`],
 list:[`<b>You and @cam took Love</b> is the confirmation. They did not join an app, they joined a side.`,
  `They can walk away here and still get told how it went, which is the cheapest reason to come back.`]},

{k:'Out of window',
 html:`<div class="top"><span>LFS</span><span class="me">&nbsp;</span></div>
  <div class="land">
    <div class="from"><span class="dot"></span>
      <span class="txt">@cam took Love and it landed.
        <em>29% of the room did.</em></span></div>
    <div style="display:flex;justify-content:center">${CARD}</div>
    <div class="count"><div class="k">Tomorrow's call opens in</div><div class="t">4:12:06</div></div>
    <button class="btn send" style="align-self:center">Tell me when it opens</button>
    <div class="foot">One pick a day &#183; the whole world<br><b>gets the same one</b></div>
  </div>`,
 title:'Three in the morning is not a dead end',
 tag:'The edge case that decides the funnel',
 body:[`Most opens will land between windows, and a link that says <b>come back later</b> loses the person. This shows the card that got them here, the exact time the next call opens, and one button.`,
  `<b>Tell me when it opens</b> is the capture. It costs them nothing and it is the only thing on the screen.`],
 list:[`The line at the bottom is doing real work: one pick a day and everybody gets the same one is the whole product in nine words.`]},

{k:'Standing with you',
 html:`<div class="top"><span>LFS &#183; AUG 19</span><span class="me">@cam</span></div>
  <div class="live">
    <div class="band"><div class="n">232</div><div class="n">218</div></div>
    <div class="feedish">
      <div class="pl"><div class="m">Q4 7:33 &#183; Touchdown</div>
        <div class="t">Love 36 yard touchdown pass to Watson</div></div>
      <div class="pl"><div class="m">Q4 3:52 &#183; Field goal</div>
        <div class="t">Love 22 yards to Reed. Crosby good from 39</div></div>
    </div>
    <div class="withyou"><div class="k">Standing with you</div>
      <div class="l"><b>4</b><span>people you know are still alive</span></div>
      <div class="hands"><span class="hand">@dev</span><span class="hand">@marcus</span>
        <span class="hand b">@ro</span><span class="hand">@jules</span></div></div>
  </div>`,
 title:'The reason you open it tomorrow',
 tag:'The repeat hook',
 body:[`One line under the feed: <b>4 people you know are still alive</b>, with handles, coloured by the side they took. That is the whole social layer.`,

let cur=0;
function draw(){
  el('steps').innerHTML=STEPS.map((s,i)=>
    `<button data-i="${i}" class="${i===cur?'on':''}"><span class="n">${i+1}</span>${s.k}</button>`).join('');
  [...el('steps').children].forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw();});
  const s=STEPS[cur];
  el('phone').innerHTML=`<div class="panel on">${s.html}</div>`;
  el('note').innerHTML=`<span class="k">${s.tag}</span><h2>${s.title}</h2>`+
    s.body.map(p=>`<p>${p}</p>`).join('')+
    (s.list?`<ul>${s.list.map(x=>`<li>${x}</li>`).join('')}</ul>`:'');
}
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){cur=Math.min(cur+1,STEPS.length-1);draw();}
  if(e.key==='ArrowLeft'){cur=Math.max(cur-1,0);draw();}
});
draw();
</script>
